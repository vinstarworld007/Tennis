[package]
name = "courtside"
version = "0.1.0"
description = "Tennis stroke analysis for players and coaches"
edition = "2021"

[lib]
name = "courtside_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
